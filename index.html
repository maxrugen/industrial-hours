<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Hours Calculator</title>
    <meta name="description" content="Convert hh:mm or minutes to industrial (decimal) hours and back.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <main id="converter">
        <h1>Industrial Hours Calculator</h1>
        <form id="converterForm" novalidate>
            <label for="timeInput">Enter hh:mm, minutes, or decimal hours:</label>
            <div class="inputRow">
                <input type="text" id="timeInput" autocomplete="off" aria-describedby="error">
                <button type="submit">Calculate</button>
            </div>
        </form>
        <p id="result" aria-live="polite"></p>
        <p id="error" class="error" role="alert"></p>
        <details>
            <summary>Conversion table</summary>
            <div id="conversionTables" class="conversionTables"></div>
        </details>
    </main>
</body>
</html>
